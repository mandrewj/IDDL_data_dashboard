name: Weekly data refresh

on:
  schedule:
    # Mondays 09:00 UTC ≈ 5am EDT / 4am EST. GitHub can delay scheduled runs
    # under load; workflow_dispatch always fires immediately.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      allow_partial:
        description: "Commit even if one source failed (records the error in the snapshot)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The iNat pull is rate-limited to ~1 page/sec and the DwC-A zip is ~400 KB;
    # a normal run is a couple of minutes. The padding is for a slow upstream.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm install, not npm ci: this job only needs the script to run, and the
      # lockfile shouldn't gate a data refresh.
      - run: npm install --no-audit --no-fund

      - name: Rebuild data snapshot
        id: build
        env:
          # Optional repo variables; the script falls back to its own defaults
          # when these are unset, so an empty value is safe.
          NEXT_PUBLIC_INAT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_INAT_PROJECT_ID }}
          NEXT_PUBLIC_DWCA_URL: ${{ vars.NEXT_PUBLIC_DWCA_URL }}
        run: |
          if [ "${{ inputs.allow_partial }}" = "true" ]; then
            npm run build:data -- --allow-partial
          else
            npm run build:data
          fi

      # GBIF usage metrics for /impact. Independent of the occurrence pull: if
      # GBIF is down the script leaves last week's file alone and this step only
      # warns, so it can never block an occurrence refresh.
      - name: Refresh GBIF usage metrics
        id: gbif
        continue-on-error: true
        run: npm run build:gbif

      - name: Warn on GBIF failure
        if: steps.gbif.outcome == 'failure'
        run: echo "::warning::GBIF metrics refresh failed; data/gbif-metrics.json keeps last week's numbers."

      # Cheap structural check on what we just built: catches a corrupt or
      # internally inconsistent snapshot before it can be committed.
      - name: Verify snapshot
        run: npm run verify:data

      - name: Commit and push
        if: steps.build.outputs.changed == 'true' || steps.gbif.outputs.gbif_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only what really changed: build:data rewrites generatedAt even
          # when the records are identical, and that alone isn't worth a commit.
          if [ "${{ steps.build.outputs.changed }}" = "true" ]; then
            git add data/snapshot.json
            subject="Auto-refresh occurrence data — ${{ steps.build.outputs.total }} records"
          else
            git checkout -- data/snapshot.json
            subject="Auto-refresh GBIF usage metrics"
          fi
          if [ "${{ steps.gbif.outputs.gbif_changed }}" = "true" ]; then
            git add data/gbif-metrics.json
          else
            git checkout -- data/gbif-metrics.json
          fi
          git commit \
            -m "$subject" \
            -m "${{ steps.build.outputs.inat }} iNaturalist / ${{ steps.build.outputs.dwca }} INDD specimens / ${{ steps.build.outputs.both }} matched in both. GBIF: ${{ steps.gbif.outputs.gbif_downloads || 'n/a' }} downloads, ${{ steps.gbif.outputs.gbif_citations || 'n/a' }} citations. Pulled by .github/workflows/refresh-data.yml."

          # main can move during the few-minute pull (a manual push was
          # rejecting ours with "fetch first"). Replay onto it, but never force
          # our data files over ones committed meanwhile — next week's run will
          # redo it with the newer code.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "::warning::data files changed on main during this run; skipped the push."
            exit 0
          fi
          # The rebase may have brought in code (e.g. a SNAPSHOT_VERSION bump)
          # that this snapshot no longer satisfies — check before publishing.
          npm run verify:data
          git push

      - name: Report no-op
        if: steps.build.outputs.changed != 'true' && steps.gbif.outputs.gbif_changed != 'true'
        run: echo "Upstream records and GBIF metrics are identical to what's committed — nothing to commit."

      - name: Warn on partial snapshot
        if: steps.build.outputs.partial == 'true'
        run: echo "::warning::One upstream source failed; the snapshot was written with a recorded error and the dashboard will show the source banner."
